server {
  listen 80;

  location / {
    root /usr/share/nginx/html;
    index index.html;
    try_files $uri /index.html;
  }

  # Proxy API requests to your local backend
  location /api {
    proxy_pass http://host.docker.internal:5000;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection 'upgrade';
    proxy_set_header Host $host;
    proxy_cache_bypass $http_upgrade;
  }

  # Proxy WebSocket requests
  location /ws {
    proxy_pass http://host.docker.internal:5000;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "Upgrade";
    proxy_set_header Host $host;
  }

  # Sarvam Proxies (Mirroring Vite configuration)
  location /sarvam-api/ {
    proxy_pass https://api.sarvam.ai/;
    proxy_ssl_server_name on;
    proxy_set_header Host api.sarvam.ai;
  }

  location /sarvam-blob/ {
    proxy_pass https://appsprodpublicsa.blob.core.windows.net/;
    proxy_ssl_server_name on;
    proxy_set_header Host appsprodpublicsa.blob.core.windows.net;
  }
}